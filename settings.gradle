pluginManagement { repositories { gradlePluginPortal(); maven { url = 'https://maven.neoforged.net/releases' } } }
rootProject.name = 'anthub'
include 'core', 'helper', 'mod'

include 'bootstrap'

["core", "mod", "helper", "bootstrap"].each { name ->
    project(":" + name).projectDir = file("anthub/" + name)
}

// Separate terminal client migration release; legacy modules remain available.
include "bridge", "bridge-helper", "bridge-bootstrap"
["bridge", "bridge-helper", "bridge-bootstrap"].each { name ->
    project(":" + name).projectDir = file("anthub/" + name)
}
