name: Publish AntHub
on:
  workflow_call:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: anthub-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download tested Linux bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --name anthub-ubuntu-latest --dir tested
      - name: Package and publish new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python anthub/tooling/release.py --artifact tested --publish
