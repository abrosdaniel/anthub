name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  java:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew build --no-daemon
        shell: bash
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anthub-${{ matrix.os }}
          path: |
            anthub/mod/build/libs/*.jar
            anthub/core/build/reports/tests/
  postgres:
    strategy:
      fail-fast: false
      matrix:
        version: [17, 18]
    runs-on: ubuntu-latest
    services:
      database:
        image: postgres:${{ matrix.version }}
        env:
          POSTGRES_USER: anthub_test
          POSTGRES_PASSWORD: anthub_ci_test_only
          POSTGRES_DB: anthub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anthub_test -d anthub_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ANTHUB_TEST_DB_HOST: 127.0.0.1
      ANTHUB_TEST_DB_PORT: 5432
      ANTHUB_TEST_DB_PASSWORD: anthub_ci_test_only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew :core:postgresTest --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: postgres-${{ matrix.version }}-tests
          path: anthub/core/build/reports/tests/postgresTest/
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r anthub/tooling/requirements.txt
      - run: python anthub/tooling/seed/anthub.py validate template
      - run: python -m unittest discover -s anthub/tooling/tests

  release:
    needs: [java, contracts, postgres]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release.yml
