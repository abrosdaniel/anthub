name: AntHub to Rivet migration installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: ./gradlew :bridge-bootstrap:build :bridge-helper:test --no-daemon
        shell: bash
      - run: python anthub/tooling/verify_rivet_target.py
      - run: python anthub/tooling/bridge_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: anthub-migration-${{ matrix.os }}
          path: |
            dist/bridge-3.9.0/
            anthub/bridge-helper/build/reports/tests/
