name: Publish pack
on:
  push:
    branches: ['**']
permissions:
  contents: read
concurrency:
  group: pack-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && !github.event.deleted
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check pack version
        id: plan
        run: python tooling/release_plan.py
      - if: steps.plan.outputs.publish == 'true'
        run: pip install -r tooling/requirements.txt
      - if: steps.plan.outputs.publish == 'true'
        run: python tooling/anthub.py validate .
      - name: Build release
        if: steps.plan.outputs.publish == 'true'
        env:
          ANTHUB_SEQUENCE: ${{ steps.plan.outputs.sequence }}
        run: python tooling/publish.py build
      - name: Verify release hashes
        if: steps.plan.outputs.publish == 'true'
        run: python tooling/anthub.py verify-release release-output
      - name: Publish immutable release and stable channel
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tooling/publish.py publish
